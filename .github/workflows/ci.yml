name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use npm 11 (npm 10 resolver crash workaround)
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Harness layout guard (no root-level .harness regression)
        run: npm run harness:layout

      - name: Full harness verification (when governance records are present)
        if: hashFiles('docs/harness/traces/traceability-ledger.json') != '' && hashFiles('docs/harness/human-gates.json') != '' && hashFiles('docs/harness/discovery-baseline.json') != ''
        shell: pwsh
        run: ./scripts/verify-harness.ps1
