<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh-task-cleaner</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1a1a1a; }
      .app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
      .app-nav { border-right: 1px solid #ddd; padding: 1rem; }
      .app-nav a { display: block; margin: 0.25rem 0; color: inherit; }
      .app-main { padding: 1.5rem; min-width: 0; }
      .view-title { margin: 0 0 0.25rem; }
      .view-subtitle { color: #555; margin: 0 0 1rem; }
      .data-table { border-collapse: collapse; width: 100%; }
      .data-table th, .data-table td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
      .view-state { margin: 1rem 0; padding: 1rem; border: 1px dashed #bbb; }
      .view-state--error { border-color: #b00020; color: #b00020; }
      .sr-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @media (max-width: 767px) {
        .app-shell { grid-template-columns: 1fr; }
        .app-nav { border-right: none; border-bottom: 1px solid #ddd; }
        .data-table, .data-table tbody, .data-table tr, .data-table td { display: block; }
        .data-table thead { display: none; }
        .data-table td::before { content: attr(data-label); font-weight: 600; display: block; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <nav class="app-nav" aria-label="Primary">
        <a href="#/">Overview</a>
        <a href="#/tasks/tsk_demo_001/plan">Plan</a>
        <a href="#/quarantine">Quarantine</a>
        <a href="#/audit">Audit</a>
        <a href="#/settings">Configuration</a>
      </nav>
      <main class="app-main" id="app"></main>
    </div>
    <script type="module" src="../../dist-web/web/main.js"></script>
  </body>
</html>
